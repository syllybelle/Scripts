schema_version: 1

source_of_truth:
  note: >
    These values are reference examples for this repository. The authoritative
    values remain the URLs shown during API client setup in Viedoc Admin and the
    endpoint lists published in Viedoc Help.
  viedoc_admin: "Use the exact URLs shown when the API client is created in Viedoc Admin."
  help_urls:
    - "https://help.viedoc.net/l/debc54/"

usage_notes:
  clinic: "Browser URL used to access the Viedoc application UI."
  web_api_base: "Base URL for the Viedoc Web API used by export and site/user scripts."
  sts_base: "Base URL for the security token service host."
  sts_token: "Token endpoint used by Web API clients to obtain OAuth tokens."
  swagger: "Swagger UI for exploring the Viedoc Web API."
  wcf_wsdl: "WSDL URL for the WCF API used with the Data Import Application."

regions:
