        sts_token: "https://v4sts.viedoc.net/connect/token"
        swagger: "https://v4api.viedoc.net/swagger/index.html"
        wcf_wsdl: "https://v4api.viedoc.net/HelipadService.svc?wsdl"
      training:
        clinic: "https://v4training.viedoc.net/"
